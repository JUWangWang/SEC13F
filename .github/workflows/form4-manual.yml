name: Generate Form4 (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-form4-main
  cancel-in-progress: false

jobs:
  form4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-form4.txt
      - run: pip install -r requirements-form4.txt
      - uses: actions/cache@v4
        with:
          path: ../sec-cache
          key: form4-edgar-${{ runner.os }}-${{ github.run_id }}
          restore-keys: form4-edgar-${{ runner.os }}-
      - name: Verify Form4 adapter
        run: python -m unittest discover -s tests -v
      - name: Fetch original Form4 data (13F is not executed)
        run: python -u run_form4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: form4-results-and-run-metadata
          path: |
            insider_form4/
            run_manifest.json
      - name: Publish successful results
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          meta=json.loads(pathlib.Path('run_manifest.json').read_text())
          pathlib.Path('form4-output-path.txt').write_text(meta['output_file'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          output_file="$(cat form4-output-path.txt)"
          git add -- "$output_file" "$(dirname "$output_file")/Form4_Run_Metadata.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish manual Form4 result'
          git pull --rebase origin main
          git push origin HEAD:main
